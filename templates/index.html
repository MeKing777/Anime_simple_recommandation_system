<!DOCTYPE html>
<html>
<head>
    <title>Anime Recommendation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Anime Recommendation</h1>
        <form action="/recommend" method="POST">
            <label>Genre:</label>
            <div class="check-grid">
                {% for g in genres %}
                <label class="check-item">
                    <input type="checkbox" name="genre" value="{{ g }}">
                    {{ g }}
                </label>
                {% endfor %}
            </div>
            <label>Anime Type:</label>
            <div class="check-grid">
                {% for t in types %}
                <label class="check-item">
                    <input type="radio" name="anime_type" value="{{ t }}" {% if loop.first %}required{% endif %}>
                    {{ t }}
                </label>
                {% endfor %}
            </div>
            <label>Minimum Score (1-10):</label>
            <input type="number" name="min_score" min="1" max="10" step="0.1" value="7" required>
            <button type="submit">Recommend</button>
        </form>
    </div>
</body>
</html>
